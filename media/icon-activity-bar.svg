<!--
  Activity-bar icon. Monochrome, single-stroke, currentColor fill so it
  adapts to VS Code's light/dark themes and matches the line-art
  convention of neighboring extensions.

  Renders ~16-20px in the activity bar; designed to stay legible there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Laser warning triangle: equilateral with rounded corners. -->
  <path d="M 12 3.5 L 21 19 Q 21.6 20 20.4 20 L 3.6 20 Q 2.4 20 3 19 Z"/>
  <!-- Centered checkmark in the lower optical centre of the triangle. -->
  <polyline points="7.5,14 11,17 16.5,11.5"/>
</svg>
