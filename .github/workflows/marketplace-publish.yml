name: Publish VSIX to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.7.7"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dispatch-main-publish:
    name: Queue Marketplace publish from main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch main publish workflow
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH with optional semver suffix: $tag" >&2
            exit 1
          fi
          gh workflow run marketplace-publish.yml --ref main -f tag="$RELEASE_TAG"

  build-vsix-package:
    name: Verify PangoLint VSIX package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH with optional semver suffix: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate release tag is on main history
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Release tag must resolve to a commit in origin/main history: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build VSIX package
        run: npm run package:vsix

      - name: Stage VSIX package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "pangolint-$RELEASE_VERSION.vsix" release-assets/

      - name: Upload VSIX package
        uses: actions/upload-artifact@v6
        with:
          name: pangolint-vsix
          path: release-assets/pangolint-${{ steps.release.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7

  publish-vsix:
    name: Publish PangoLint VSIX
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-vsix-package
    permissions:
      contents: read
    environment:
      name: marketplace-publish
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download VSIX package
        uses: actions/download-artifact@v7
        with:
          name: pangolint-vsix
          path: release-assets

      - name: Check Marketplace version
        id: marketplace
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build-vsix-package.outputs.version }}
          npm_config_ignore_scripts: "true"
        run: |
          if ! npx --yes @vscode/vsce@3.9.1 show jd3lasersllc.pangolint --json > marketplace.json 2> marketplace.err; then
            cat marketplace.err >&2
            echo "Unable to query the Marketplace listing for jd3lasersllc.pangolint." >&2
            exit 1
          fi
          exists="$(node -e "const data=require('./marketplace.json'); const version=process.env.RELEASE_VERSION; console.log((data.versions || []).some((item) => item.version === version) ? 'true' : 'false')")"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ]; then
            echo "jd3lasersllc.pangolint@$RELEASE_VERSION is already published."
          fi

      - name: Publish VSIX to Marketplace
        if: steps.marketplace.outputs.exists != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          RELEASE_VERSION: ${{ needs.build-vsix-package.outputs.version }}
          npm_config_ignore_scripts: "true"
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "GitHub Actions secret VSCE_PAT is required to publish to the VS Code Marketplace." >&2
            exit 1
          fi
          npx --yes @vscode/vsce@3.9.1 publish --packagePath "release-assets/pangolint-$RELEASE_VERSION.vsix"
