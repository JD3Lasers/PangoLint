name: Publish VSIX to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.7.7"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-vsix:
    name: Publish PangoLint VSIX
    runs-on: ubuntu-latest
    environment:
      name: marketplace-publish
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH with optional semver suffix: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download release VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "pangolint-$RELEASE_VERSION.vsix" \
            --pattern "SHA256SUMS" \
            --dir release-assets

      - name: Verify release VSIX
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd release-assets
          grep "pangolint-$RELEASE_VERSION.vsix$" SHA256SUMS | shasum -a 256 -c -
          cd ..
          node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          const version = process.env.RELEASE_VERSION;
          const text = execFileSync("unzip", ["-p", `release-assets/pangolint-${version}.vsix`, "extension/package.json"], {
            encoding: "utf8",
          });
          const pkg = JSON.parse(text);
          if (pkg.publisher !== "jd3lasersllc" || pkg.name !== "pangolint" || pkg.version !== version) {
            throw new Error(`Unexpected VSIX package identity: ${pkg.publisher}.${pkg.name}@${pkg.version}`);
          }
          NODE

      - name: Check Marketplace version
        id: marketplace
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          npm_config_ignore_scripts: "true"
        run: |
          if ! npx --yes @vscode/vsce@3.9.1 show jd3lasersllc.pangolint --json > marketplace.json 2> marketplace.err; then
            cat marketplace.err >&2
            echo "Unable to query the Marketplace listing for jd3lasersllc.pangolint." >&2
            exit 1
          fi
          exists="$(node -e "const data=require('./marketplace.json'); const version=process.env.RELEASE_VERSION; console.log((data.versions || []).some((item) => item.version === version) ? 'true' : 'false')")"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ]; then
            echo "jd3lasersllc.pangolint@$RELEASE_VERSION is already published."
          fi

      - name: Publish VSIX to Marketplace
        if: steps.marketplace.outputs.exists != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          npm_config_ignore_scripts: "true"
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "GitHub Actions secret VSCE_PAT is required to publish to the VS Code Marketplace." >&2
            exit 1
          fi
          npx --yes @vscode/vsce@3.9.1 publish --packagePath "release-assets/pangolint-$RELEASE_VERSION.vsix"
