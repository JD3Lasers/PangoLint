name: Live BEYOND Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_live_beyond:
        description: Confirm an operator-supervised BEYOND bench is online.
        required: true
        type: boolean
        default: false
      smoke_mode:
        description: Live smoke profile to run.
        required: true
        type: choice
        default: all
        options:
          - all
          - connection
          - readback
          - udp

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.smoke_mode }}
  cancel-in-progress: false

jobs:
  live-beyond-smoke:
    name: Live BEYOND smoke
    if: ${{ inputs.confirm_live_beyond && github.ref == 'refs/heads/main' }}
    runs-on:
      - self-hosted
      - pangolint-live-beyond
    environment:
      name: live-beyond-smoke
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run live BEYOND smoke
        env:
          PANGOLINT_LIVE_BEYOND_HOST: ${{ vars.PANGOLINT_LIVE_BEYOND_HOST }}
          PANGOLINT_LIVE_BEYOND_TALK_TCP_HOST: ${{ vars.PANGOLINT_LIVE_BEYOND_TALK_TCP_HOST }}
          PANGOLINT_LIVE_BEYOND_TALK_TCP_PORT: ${{ vars.PANGOLINT_LIVE_BEYOND_TALK_TCP_PORT }}
          PANGOLINT_LIVE_BEYOND_TALK_UDP_HOST: ${{ vars.PANGOLINT_LIVE_BEYOND_TALK_UDP_HOST }}
          PANGOLINT_LIVE_BEYOND_TALK_UDP_PORT: ${{ vars.PANGOLINT_LIVE_BEYOND_TALK_UDP_PORT }}
          PANGOLINT_LIVE_BEYOND_TCP_PASSWORD: ${{ secrets.PANGOLINT_LIVE_BEYOND_TCP_PASSWORD }}
          PANGOLINT_LIVE_BEYOND_OSC_LISTEN_HOST: ${{ vars.PANGOLINT_LIVE_BEYOND_OSC_LISTEN_HOST }}
          PANGOLINT_LIVE_BEYOND_OSC_LISTEN_PORT: ${{ vars.PANGOLINT_LIVE_BEYOND_OSC_LISTEN_PORT }}
          PANGOLINT_LIVE_BEYOND_READBACK_TIMEOUT_MS: ${{ vars.PANGOLINT_LIVE_BEYOND_READBACK_TIMEOUT_MS }}
          PANGOLINT_LIVE_BEYOND_READBACK_PATH: ${{ vars.PANGOLINT_LIVE_BEYOND_READBACK_PATH }}
          PANGOLINT_LIVE_BEYOND_READBACK_TYPE: ${{ vars.PANGOLINT_LIVE_BEYOND_READBACK_TYPE }}
        run: npm run smoke:live-beyond -- --mode "${{ inputs.smoke_mode }}"
