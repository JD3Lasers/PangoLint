name: Publish MCP to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.7.7"
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dispatch-main-publish:
    name: Queue npm publish from main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch main publish workflow
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH with optional semver suffix: $tag" >&2
            exit 1
          fi
          gh workflow run npm-publish.yml --ref main -f tag="$RELEASE_TAG"

  build-mcp-package:
    name: Verify pangolint-mcp package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH with optional semver suffix: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate release tag is on main history
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Release tag must resolve to a commit in origin/main history: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mcp_version="$(node -p "require('./mcp/package.json').version")"
          if [ "$mcp_version" != "$version" ]; then
            echo "mcp/package.json version $mcp_version does not match package.json version $version" >&2
            exit 1
          fi
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build MCP package tarball
        run: npm run package:mcp

      - name: Verify MCP package tarball
        run: npm run check:mcp

      - name: Verify package version is not already published
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "pangolint-mcp@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "pangolint-mcp@$RELEASE_VERSION is already published." >&2
            exit 1
          fi

      - name: Stage MCP tarball
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "mcp/pangolint-mcp-$RELEASE_VERSION.tgz" release-assets/

      - name: Upload MCP tarball
        uses: actions/upload-artifact@v6
        with:
          name: pangolint-mcp-tarball
          path: release-assets/pangolint-mcp-${{ steps.release.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish-mcp:
    name: Publish pangolint-mcp
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-mcp-package
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-publish
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download MCP tarball
        uses: actions/download-artifact@v7
        with:
          name: pangolint-mcp-tarball
          path: release-assets

      - name: Verify package version is not already published
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build-mcp-package.outputs.version }}
        run: |
          if npm view "pangolint-mcp@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "pangolint-mcp@$RELEASE_VERSION is already published." >&2
            exit 1
          fi

      - name: Publish MCP package
        env:
          RELEASE_VERSION: ${{ needs.build-mcp-package.outputs.version }}
        run: npm publish "./release-assets/pangolint-mcp-$RELEASE_VERSION.tgz" --provenance
